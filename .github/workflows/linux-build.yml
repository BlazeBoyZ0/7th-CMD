name: Linux Build and Resource Checks

on:
  push:
    branches:
      - v0.1-gpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DSEVENTH_CMD_BUILD_TESTS=ON

      - name: Compile
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Measure executable and installed size
        shell: bash
        run: |
          set -euo pipefail
          executable_bytes="$(stat -c '%s' build/7thcmd)"
          install_root="$RUNNER_TEMP/7thcmd-install"
          cmake --install build --prefix "$install_root"
          installed_bytes="$(du -sb "$install_root" | cut -f1)"
          echo "Executable size: $executable_bytes bytes"
          echo "Installed tree size: $installed_bytes bytes"
          {
            echo "### Build size"
            echo "- Executable: $executable_bytes bytes"
            echo "- Installed tree: $installed_bytes bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure runtime memory
        run: python3 .github/scripts/measure_runtime.py build/7thcmd
